name: Auto Sync Android Package Catalog

on:
  schedule:
    - cron: '0 3 * * 0' # Runs automatically every Sunday at 03:00 UTC
  workflow_dispatch:     # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync and Play Store title scraper
        run: |
          python sync.py

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog.min.json titles_cache.json
          if git diff --staged --quiet; then
            echo "No changes in package catalog."
          else
            git commit -m "chore(catalog): automated sync with Play Store official titles"
            git push
          fi

